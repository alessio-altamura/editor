<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:*; font-src 'self' http://127.0.0.1:*">
<title>doc</title>
<link rel="stylesheet" href="style.css">
<style id="card-fonts"></style>
<script src="renderer.js" defer></script>
</head>
<body data-view="canvas">
<nav id="navigator">
  <input id="search" type="search" placeholder="Cerca per id o titolo" aria-label="Cerca">
  <div id="shelves"></div>
  <p id="python" role="status" hidden><span data-icon="loader-circle" aria-hidden="true"></span><span class="python-text"></span></p>
</nav>
<main id="board" aria-label="Foglio">
  <header class="bar">
    <button data-show="page" data-icon="file-text" aria-label="Pagina" title="Vista pagina (Cmd-2)">Pagina</button>
    <button id="sequence-start" data-icon="list-ordered" data-icon-text disabled>Metti in sequenza</button>
    <button id="archive" data-icon="archive" aria-label="Archivia" disabled title="Archivia le schede scelte (Canc)">Archivia</button>
    <span class="arrange">Metti in ordine: <button id="arrange-kind">per tipo</button> <button id="arrange-tag">per tag</button></span>
    <input id="find" type="search" placeholder="Trova sul foglio" aria-label="Trova sul foglio">
    <button id="find-previous" data-icon="chevron-up" aria-label="Precedente" title="Precedente (Maiusc-Invio)">↑</button><button id="find-next" data-icon="chevron-down" aria-label="Successivo" title="Successivo (Invio)">↓</button>
    <span id="find-count" role="status"></span>
    <span id="notice" role="status"></span>
    <span id="zoom">100%</span>
  </header>
  <div id="viewport">
    <div id="plane"><div id="band" hidden></div></div>
    <p id="empty" hidden>Doppio clic per scrivere un testo; trascina qui un oggetto dal navigator.</p>
    <aside id="sequence" hidden aria-label="Metti in sequenza">
      <h2>Metti in sequenza</h2>
      <ol id="order"></ol>
      <input id="compose-title" type="text" placeholder="Titolo dell'article" aria-label="Titolo dell'article">
      <div class="actions"><button id="compose">Crea l'article</button><button id="sequence-cancel">Annulla</button></div>
    </aside>
  </div>
</main>
<main id="source">
  <header id="bar" class="bar"><button data-show="canvas" data-icon="layout-dashboard" aria-label="Foglio" title="Vista foglio (Cmd-1)">Foglio</button><span id="file">Nessun file aperto</span><span id="page-notice" role="status"></span><button id="extract" data-icon="scissors" data-icon-text hidden>Estrai in un oggetto</button><button id="turn-into" data-icon="table-properties" data-icon-text hidden>Trasforma in collection</button><button id="data" data-icon="table" aria-label="Dati" title="Il file dei dati" hidden>Dati</button><button id="mode" data-icon="file-code" aria-label="Testo" hidden>Testo</button><button id="detach" data-icon="app-window" aria-label="Stacca l'anteprima" title="L'anteprima in una finestra separata">Stacca</button></header>
  <div id="editor"></div>
  <div id="grid" hidden></div>
  <div id="chart" hidden></div>
  <div id="formula" hidden></div>
</main>
<section id="preview" aria-label="Anteprima"></section>
</body>
</html>
